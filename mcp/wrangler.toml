# Weltenschmiede MCP-Server – Cloudflare Worker
# Einrichten: siehe README.md in diesem Ordner.
name = "weltenschmiede-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Entwicklerdoku (CLAUDE.md) als Text bündeln – Werkzeug app_doku
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
FIREBASE_API_KEY = "AIzaSyDlDyPSUlgtKNiWe69SFagDBU_kuwF8doA"
FIREBASE_PROJECT = "weltenschmiede"
APP_URL = "https://weltenschmiede.claudidorer.workers.dev/"
# Erlaubte Rücksprung-Adressen nach der Anmeldung (OAuth) – leer lassen nutzt die Vorgabe im Code
# (Claude, ChatGPT, Gemini, Cursor, VS Code, Windsurf, Zed, Raycast …; lokale Schleifenadressen sind immer erlaubt).
# "=host" = nur genau dieser Host. Keine Hosts mit Nutzerinhalten (script.google.com, googleusercontent.com …)!
ALLOWED_REDIRECT_HOSTS = "claude.ai,claude.com,anthropic.com,chatgpt.com,openai.com,=gemini.google.com,=aistudio.google.com,cursor.com,cursor.sh,=vscode.dev,=insiders.vscode.dev,=github.com,windsurf.com,codeium.com,zed.dev,raycast.com,perplexity.ai,mistral.ai"
# Eigene Adressschemata der Desktop-Programme
ALLOWED_REDIRECT_SCHEMES = "vscode,vscode-insiders,cursor,windsurf,zed,claude,lmstudio,raycast,msty,cherrystudio,witsy"

# Geheimnis (nicht hier eintragen!):  npx wrangler secret put SEAL_SECRET

# Anmeldeversuche begrenzen: 10 je Minute und Adresse bzw. Name
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
